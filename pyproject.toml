[project]
name = "tiferet-dl"
version = "0.1.0"
description = "Prototype deep-learning domain experiments for Tiferet."
requires-python = ">=3.10"
dependencies = [
    "tiferet>=2.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[build-system]
requires = [
    "setuptools>=61.0",
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.setuptools.packages.find]
include = [
    "tiferet_dl*",
]
